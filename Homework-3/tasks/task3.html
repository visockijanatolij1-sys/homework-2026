<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 3, Task 3</title>
  </head>
  <body>
    <h1>Задача 3</h1>

    <p>
      Випадковим чином генерується число від 1 до 5. Спробуйте вгадати число за
      2 спроби.
    </p>
    <script>
      // Генеруємо випадкове  число від 1 до 5;
      const randomNumber = Math.floor(Math.random() * 5) + 1;

      // Просимо користувача ввести число від 1 до 5;
      const userFirstGuessNumber = parseInt(prompt("Введіть число від 1 до 5"));

      // Знаходимо результат
      if (userFirstGuessNumber === randomNumber) {
        alert("Так це воно!");
      } else {
        alert(`Ні, компютер загадав інше число`);
        const userSecondGuessNumber = parseInt(
          prompt("Введіть число від 1 до 5"),
        );

        // Знаходимо результат
        if (userSecondGuessNumber === randomNumber) {
          alert("Так це воно!");
        } else {
          alert(`Ні, компютер загадав число ${randomNumber}`);
        }
      }
    </script>
  </body>
</html>
