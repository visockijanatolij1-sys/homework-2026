<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 3, Task 4</title>
  </head>
  <body>
    <h1>Задача 4</h1>

    <p>
      З клавіатури вводиться вік людини. Вивести на екран ким він є (дитиною у
      садочку, школярем, студентом, працівником, пенсіонером).
    </p>
    <script>
      // Просимо користувача ввести  вік людини
      const userAge = parseInt(prompt("Введіть вік"));

      // Знаходимо результат
      let result = 0;
      if (userAge >= 0 && userAge <= 5) {
        result = "Дитина в садочку";
      } else if (userAge >= 6 && userAge <= 17) {
        result = "Школяр";
      } else if (userAge >= 18 && userAge <= 22) {
        result = "Студент";
      } else if (userAge >= 23 && userAge <= 64) {
        result = "Працівник";
      } else if (userAge >= 65 && userAge <= 123) {
        result = "Пенсіонер";
      } else {
        result = "Ввів невірні дані";
      }
      // Виводимо результат
      document.write(`Вітаю ти - ${result}`);
    </script>
  </body>
</html>
