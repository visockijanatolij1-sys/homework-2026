<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 3, Task 7</title>
  </head>
  <body>
    <h1>Задача 7</h1>

    <p>
      З клавіатури вводиться номер місяця. Вивести до якої пори він відноситься.
    </p>
    <script>
      //Просимо користувача ввести номер місяця
      const inputMonthNumber = parseInt(prompt("Введіть номер місяця"));

      // Знаходимо результат
      let result = "";
      switch (inputMonthNumber) {
        case 1:
        case 2:
        case 12:
          result = "Зима";
          break;

        case 3:
        case 4:
        case 5:
          result = "Весна";
          break;

        case 6:
        case 7:
        case 8:
          result = "Літо";
          break;
        case 9:
        case 10:
        case 11:
          result = "Осінь";
          break;

        default:
          result = "Щось пішло не так";
          break;
      }

      // Виводимо результат
      document.write(`Буде - ${result}`);
    </script>
  </body>
</html>
