<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 3, Task 6</title>
  </head>
  <body>
    <h1>Задача 6</h1>

    <p>З клавіатури вводиться номер дня тижня. Вивести на екран назву дня.</p>
    <script>
      // Просимо користувача ввести номер дня тижня
      const inputDay = parseInt(prompt("Введіть номер дня тижня"));

      // Знаходимо результат
      let result = "";
      switch (inputDay) {
        case 1:
          result = "Понеділок";
          break;
        case 2:
          result = "Вівторок";
          break;
        case 3:
          result = "Середа";
          break;
        case 4:
          result = "Четвер";
          break;
        case 5:
          result = "П'ятниця";
          break;
        case 6:
          result = "Субота";
          break;
        case 7:
          result = "Неділя";
          break;
        default:
          result = "Щось пішло не так";
          break;
      }

      // Виводимо результат
      document.write(`Назва дня - ${result}`);
    </script>
  </body>
</html>
