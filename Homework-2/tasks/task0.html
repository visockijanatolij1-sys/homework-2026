  <body>
    <h1>Задача 0</h1>

    <p>Обчислити значення виразів</p>
    <ul>
      <li>
        <img src="../images/0.1.png" alt="" />
      </li>
      <li>
        <img src="../images/0.2.png" alt="" />
      </li>
      <li>
        <img src="../images/0.3.png" alt="" />
      </li>
      <li>
        <img src="../images/0.4.png" alt="" />
      </li>
    </ul>
    <script>
      // Просимо користувача ввести a b c
      const a = parseFloat(prompt("Введіть число a"));
      const b = parseFloat(prompt("Введіть число b"));
      const c = parseFloat(prompt("Введіть число c"));

      // Знаходимо результат

      const resultOne = a + 12 + b;
      const resultTwo = Math.sqrt((a + b) / (2 * a));
      const resultThree = Math.cbrt((a + b) * c);
      const resultFour = Math.sin(a / (b * -1));

      // Виводимо результат
      document.write(`
        resultOne = ${resultOne}<br>
        resultTwo = ${resultTwo}<br>
        resultThree = ${resultThree}<br>
        resultFour = ${resultFour}<br>
      `);
    </script>
