<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 2, Task 6</title>
  </head>
  <body>
    <h1>Задача 6</h1>

    <p>
      З клавіатури вводяться вартість товару та кількість одиниць 3 товарів.
      Обчислити вартість кожного товару окремо та загальну вартість. Вивести чек
      (як у супермаркеті), використовуючи елементи розмітки.
    </p>

    <script>
      // Просимо користувача вказати вартість товару та кількість одиниць 3 товарів.
      const firstProductPrice = parseFloat(
        prompt("Введіть вартість першого товару який ви хочете придбати"),
      );
      const firstProductCount = parseInt(
        prompt("Введіть кількість першого товару який ви хочете придбати"),
      );

      const secondProductPrice = parseFloat(
        prompt("Введіть вартість другого товару який ви хочете придбати"),
      );
      const secondProductCount = parseInt(
        prompt("Введіть кількість другого товару який ви хочете придбати"),
      );

      const thirdProductPrice = parseFloat(
        prompt("Введіть вартість третього товару який ви хочете придбати"),
      );
      const thirdProductCount = parseInt(
        prompt("Введіть кількість третього товару який ви хочете придбати"),
      );

      // Знаходимо результат
      const firstProductTotalPrice = firstProductCount * firstProductPrice;
      const secondProductTotalPrice = secondProductCount * secondProductPrice;
      const thirdProductTotalPrice = thirdProductCount * thirdProductPrice;
      const productsTotalPrice =
        firstProductTotalPrice +
        secondProductTotalPrice +
        thirdProductTotalPrice;

      // Виводимо результат
      document.write(`
  <h2>Чек покупки</h2>
  <hr>

  <table border="1" cellpadding="10" cellspacing="0">
    <thead>
      <tr>
        <th>Товар</th>
        <th>Ціна за шт.</th>
        <th>Кількість</th>
        <th>Вартість</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Товар №1</td>
        <td>${firstProductPrice.toFixed(2)} грн</td>
        <td>${firstProductCount}</td>
        <td>${firstProductTotalPrice.toFixed(2)} грн</td>
      </tr>

      <tr>
        <td>Товар №2</td>
        <td>${secondProductPrice.toFixed(2)} грн</td>
        <td>${secondProductCount}</td>
        <td>${secondProductTotalPrice.toFixed(2)} грн</td>
      </tr>

      <tr>
        <td>Товар №3</td>
        <td>${thirdProductPrice.toFixed(2)} грн</td>
        <td>${thirdProductCount}</td>
        <td>${thirdProductTotalPrice.toFixed(2)} грн</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <th colspan="3">Разом до сплати</th>
        <th>${productsTotalPrice.toFixed(2)} грн</th>
      </tr>
    </tfoot>
  </table>

  <p>Дякуємо за покупку!</p>
`);
    </script>
  </body>
</html>
