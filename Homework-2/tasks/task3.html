<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 2, Task 3</title>
  </head>
  <body>
    <h1>Задача 3</h1>

    <p>
      Дано вартість одиниці товару і кількість. Знайти загальну вартість та ПДВ
      (5% від загальної вартості).
    </p>

    <script>
      // Просимо користувача вказати вартість одиниці товару та його кількість
      const productPrice = parseFloat(prompt("Введіть ціну одного товару"));
      const productCount = parseInt(
        prompt("Введіть яку кількість товару ви хочете придбати"),
      );

      // Знаходимо результат
      const totalPrice = productPrice * productCount;
      const vatAmount = (totalPrice * 5) / 100;

      // Виводимо результат
      document.write(`
        Загальна ціна дорівнює ${totalPrice}<br> 
        ПДВ дорівнює ${vatAmount}
      `);
    </script>
  </body>
</html>
